<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShowFeed</title>
  <style>
    :root {
      --bg: #0b0d12;
      --fg: #f3ece4;
      --accent: #f2a93b;
      --muted: rgba(243, 236, 228, 0.7);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #stage {
      position: fixed;
      inset: 0;
      background: #000;
    }
    #stage img, #stage video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #stage img.on, #stage video.on { opacity: 1; }
    #stage img.cover, #stage video.cover { object-fit: cover; }
    .chrome {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 2px 12px rgba(0,0,0,0.7);
    }
    .brand {
      top: 1.5rem;
      right: 1.75rem;
      text-align: right;
    }
    .brand .title {
      font-weight: 700;
      font-size: clamp(1rem, 2.2vw, 1.4rem);
      letter-spacing: -0.02em;
    }
    .brand .sub {
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: clamp(0.75rem, 1.5vw, 0.95rem);
    }
    .meta {
      left: 1.5rem;
      bottom: 1.4rem;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: clamp(0.85rem, 1.8vw, 1.1rem);
      font-variant-numeric: tabular-nums;
    }
    .meta .dot {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }
    .empty {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 0.75rem;
      text-align: center;
      padding: 2rem;
      z-index: 5;
      background: radial-gradient(ellipse at center, #161a24 0%, #0b0d12 70%);
    }
    .empty h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
    }
    .empty p { color: var(--muted); }
    .empty.hidden { display: none; }
    .idle-msg {
      position: fixed;
      left: 50%;
      bottom: 12%;
      transform: translateX(-50%);
      z-index: 8;
      text-align: center;
      pointer-events: none;
      padding: 0.85rem 1.4rem;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.45);
      text-shadow: 0 2px 12px rgba(0,0,0,0.7);
      max-width: min(90vw, 36rem);
    }
    .idle-msg.hidden { display: none; }
    .idle-msg .line {
      font-size: clamp(1rem, 2.4vw, 1.45rem);
      font-weight: 600;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <div id="stage" aria-live="polite"></div>
  <div class="chrome brand">
    <div class="title" id="brandTitle">ShowFeed</div>
    <div class="sub" id="brandSub">Logo de l’event</div>
  </div>
  <div class="chrome meta">
    <span class="dot"></span>
    <span id="caption">En attente…</span>
  </div>
  <div class="idle-msg hidden" id="idleMsg">
    <div class="line" id="idleMsgText"></div>
  </div>
  <div class="empty" id="empty">
    <h1>ShowFeed</h1>
    <p id="emptyText">En attente de contenus approuvés…</p>
  </div>

  <script>
    (function () {
      const stage = document.getElementById("stage");
      const empty = document.getElementById("empty");
      const emptyText = document.getElementById("emptyText");
      const caption = document.getElementById("caption");
      const brandTitle = document.getElementById("brandTitle");
      const brandSub = document.getElementById("brandSub");
      const idleMsg = document.getElementById("idleMsg");
      const idleMsgText = document.getElementById("idleMsgText");

      let playlist = [];
      let index = 0;
      let photoSeconds = 8;
      let timer = null;
      let currentEl = null;
      let mode = "empty"; // playlist | idle | empty
      let idle = { enabled: true, url: null, type: null, message: "", available: false };

      const ageLabel = (iso) => {
        if (!iso) return "";
        const then = Date.parse(iso);
        if (!Number.isFinite(then)) return "";
        const sec = Math.max(0, Math.floor((Date.now() - then) / 1000));
        if (sec < 60) return `Capté il y a ${sec} s`;
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `Capté il y a ${m} min ${String(s).padStart(2, "0")}`;
      };

      const clearTimer = () => {
        if (timer) {
          clearTimeout(timer);
          timer = null;
        }
      };

      const clearStage = () => {
        clearTimer();
        if (currentEl) {
          currentEl.classList.remove("on");
          const prev = currentEl;
          setTimeout(() => prev.remove(), 700);
          currentEl = null;
        }
      };

      const setIdleChrome = (on, message) => {
        if (on && message) {
          idleMsgText.textContent = message;
          idleMsg.classList.remove("hidden");
        } else {
          idleMsg.classList.add("hidden");
        }
      };

      const showFallbackEmpty = (message) => {
        mode = "empty";
        clearStage();
        empty.classList.remove("hidden");
        emptyText.textContent = message || "En attente de contenus approuvés…";
        setIdleChrome(false);
        caption.textContent = "En attente…";
      };

      const mountIdle = () => {
        if (!idle.enabled || !idle.available || !idle.url) {
          showFallbackEmpty(idle.message);
          return;
        }
        mode = "idle";
        empty.classList.add("hidden");
        setIdleChrome(true, idle.message);
        caption.textContent = "Idle · branding";
        clearStage();

        let el;
        if (idle.type === "video") {
          el = document.createElement("video");
          el.src = idle.url + "?t=" + Date.now();
          el.muted = true;
          el.loop = true;
          el.playsInline = true;
          el.autoplay = true;
          el.classList.add("cover");
          el.addEventListener("error", () => showFallbackEmpty(idle.message));
        } else {
          el = document.createElement("img");
          el.alt = "";
          el.src = idle.url + "?t=" + Date.now();
          el.classList.add("cover");
          el.addEventListener("error", () => showFallbackEmpty(idle.message));
          // Soft refresh still while waiting for first approved shots
          timer = setTimeout(() => {
            if (mode === "idle") mountIdle();
          }, Math.max(photoSeconds, 12) * 1000);
        }

        stage.appendChild(el);
        requestAnimationFrame(() => el.classList.add("on"));
        currentEl = el;
        if (idle.type === "video") {
          el.play().catch(() => showFallbackEmpty(idle.message));
        }
      };

      const mountMedia = (item) => {
        mode = "playlist";
        empty.classList.add("hidden");
        setIdleChrome(false);
        clearStage();

        let el;
        if (item.type === "video") {
          el = document.createElement("video");
          el.src = item.url;
          el.muted = true;
          el.playsInline = true;
          el.autoplay = true;
          el.addEventListener("ended", () => next());
          el.addEventListener("error", () => {
            setTimeout(next, 800);
          });
        } else {
          el = document.createElement("img");
          el.alt = "";
          el.src = item.url;
          el.addEventListener("error", () => {
            setTimeout(next, 800);
          });
          timer = setTimeout(next, photoSeconds * 1000);
        }

        stage.appendChild(el);
        requestAnimationFrame(() => el.classList.add("on"));
        currentEl = el;
        caption.textContent = `${item.type === "video" ? "Clip" : "Photo"} · ${ageLabel(item.created_at)}`;
        if (item.type === "video") {
          el.play().catch(() => setTimeout(next, 800));
        }
      };

      const next = () => {
        if (!playlist.length) {
          mountIdle();
          return;
        }
        index = index % playlist.length;
        mountMedia(playlist[index]);
        index = (index + 1) % playlist.length;
      };

      const refresh = async () => {
        try {
          const res = await fetch("/api/playlist", { cache: "no-store" });
          if (!res.ok) throw new Error("playlist " + res.status);
          const data = await res.json();
          if (data.brand_title) brandTitle.textContent = data.brand_title;
          if (data.brand_subtitle) brandSub.textContent = data.brand_subtitle;
          if (data.photo_display_seconds) photoSeconds = data.photo_display_seconds;
          if (data.idle) idle = data.idle;

          const items = Array.isArray(data.items) ? data.items : [];
          const same =
            items.length === playlist.length &&
            items.every((it, i) => it.id === playlist[i].id);
          const wasEmpty = playlist.length === 0;
          playlist = items;

          if (!playlist.length) {
            if (mode !== "idle" && mode !== "empty") {
              mountIdle();
            } else if (mode === "empty" && idle.available) {
              mountIdle();
            }
            return;
          }

          // First content after idle → jump into playlist
          if (wasEmpty || mode === "idle" || mode === "empty" || !currentEl || !same) {
            index = 0;
            next();
          }
        } catch (err) {
          console.warn(err);
        }
      };

      refresh();
      setInterval(refresh, 5000);
      setInterval(() => {
        if (mode !== "playlist" || !playlist.length || !currentEl) return;
        const cur = playlist[(index - 1 + playlist.length) % playlist.length];
        if (cur) {
          const kind = cur.type === "video" ? "Clip" : "Photo";
          caption.textContent = `${kind} · ${ageLabel(cur.created_at)}`;
        }
      }, 1000);
    })();
  </script>
</body>
</html>
